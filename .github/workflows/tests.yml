name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for Qt / VTK
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglu1-mesa
      - name: Install
        # python-solvespace ships no Linux wheel for 3.12 and its bundled mimalloc uses ATOMIC_VAR_INIT, which
        # GCC 15 (C23 by default, newer runner images) rejects — build it as C17.
        env:
          CFLAGS: -std=gnu17
        run: pip install -r requirements.txt pytest
      - name: Test
        run: python -m pytest -q tests/
