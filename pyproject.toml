[project]
name = "daedalus-cad"
version = "2.9.0"
description = "Parametric desktop CAD with a Claude modeling copilot"
requires-python = ">=3.10,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["build123d>=0.10", "PySide6>=6.6", "vtk>=9.3", "anthropic>=0.40", "python-solvespace>=3.0.8", "ezdxf>=1.1", "mujoco>=3.2", "scipy>=1.11", "coacd>=1.0.5", "gmsh>=4.11", "scikit-fem>=10", "numba>=0.59", "openpyxl>=3.1", "shapely>=2.0", "svgelements>=1.9", "qtawesome>=1.3"]

[project.optional-dependencies]
solidworks = ["pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
daedalus = "daedalus.__main__:main"

[tool.setuptools.packages.find]
include = ["daedalus*"]

[tool.setuptools.package-data]
daedalus = ["fusion/addin/DaedalusLink/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
